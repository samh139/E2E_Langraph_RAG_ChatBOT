name: Build and deploy to Compute Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-vm-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      VM_NAME: ${{ vars.GCE_VM_NAME }}
      VM_ZONE: ${{ vars.GCE_VM_ZONE }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || 'ollama' }}
      VERTEX_EMBEDDING_MODEL: ${{ vars.VERTEX_EMBEDDING_MODEL || 'nomic-embed-text' }}
      VERTEX_EMBEDDING_VERSION: ${{ vars.VERTEX_EMBEDDING_VERSION || 'unknown' }}
      VERTEX_EMBEDDING_ENDPOINT_ID: ${{ vars.VERTEX_EMBEDDING_ENDPOINT_ID || '' }}
      APP_RELEASE: ${{ github.sha }}
      APP_GIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create model release manifest
        run: python scripts/write_model_manifest.py

      - name: Archive model release manifest
        uses: actions/upload-artifact@v4
        with:
          name: model-manifest-${{ github.sha }}
          path: build/model-manifest.json
          if-no-files-found: error

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          token_format: access_token

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and publish immutable image
        run: |
          set -euo pipefail
          image_uri="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/rag-chatbot:${GITHUB_SHA}"
          docker build --pull --tag "$image_uri" .
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Copy VM deployment script
        run: |
          gcloud compute scp scripts/deploy_vm.sh \
            "${VM_NAME}:/tmp/deploy_vm.sh" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap

      - name: Deploy containers on the VM
        run: |
          gcloud compute ssh "$VM_NAME" \
            --zone="$VM_ZONE" \
            --tunnel-through-iap \
            --command="sudo install -m 0755 /tmp/deploy_vm.sh /usr/local/bin/deploy-rag-chatbot && sudo /usr/local/bin/deploy-rag-chatbot '${IMAGE_URI}' '${GAR_LOCATION}'"
