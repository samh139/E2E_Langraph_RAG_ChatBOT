# =====================================================================
# Production RBAC Explicit Document-to-Role Permissions Mapping
# =====================================================================

policy_version: 1

roles_mapping:
  compliance_officer:
    - "RBI_KYC.pdf"
    - "RBI_KYC_FQA.pdf"
    - "RBI_CUSTOMER_SERVICES.pdf"
    - "AML Investigation Scenarios_v1.6 (1).pptx"
    
  retail_banking_staff:
    - "SBI_charges.pdf"
    - "SBI_ATM_Charges.pdf"
    - "HDFC_Revision_Charges.pdf"
    - "HDFC_SavingAcc_Service_charges.pdf"
    - "HDFC_SAVING_Nri_Charges.pdf"
    - "HDFC-Bank-Home-Loan-Agreement.pdf"
    
  corporate_banking_staff:
    - "RBI_DIGITAL_LENDING.pdf"
    - "Synthetic transaction data generation from your threshold rulebook.docx"
    - "Data_Protection_Laws_India.pdf"
    - "Data_Protection_Policy_UAE_Enhanced.pdf"
    
  bank_employee:
    - "SBI_HDFC_RBI_KnowledgeBase.pdf"
    - "Intelligent_Conversational_ChatBot_Article.docx"
    - "RetiralSettlements.pptx"

# JWT roles are mapped to the document-role tags that may be retrieved.
# Keep these exact-match defaults least-privilege; add inheritance deliberately.
role_permissions:
  compliance_officer: [compliance_officer]
  retail_banking_staff: [retail_banking_staff]
  corporate_banking_staff: [corporate_banking_staff]
  bank_employee: [bank_employee]

