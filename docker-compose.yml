services:

  # -----------------------------------------------------------------
  # 1. CORE APPLICATION WORKER (Your Python/LangGraph/Kafka Code)
  # -----------------------------------------------------------------
  app-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_worker
    tty: true
    depends_on:
      kafka:
        condition: service_started
      kafka-setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./app/configs/.env
    volumes:
      - ./:/workspace
    command: ["python", "-m", "app.services.ingestion_service"]

  # -----------------------------------------------------------------
  # 1b. CHAT WEBSOCKET GATEWAY
  # -----------------------------------------------------------------
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    env_file:
      - ./app/configs/.env
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"
    command: ["python", "-u", "-m", "app.websocket_service.main"]
    restart: unless-stopped

  # -----------------------------------------------------------------
  # 1c. CHAT RETRIEVAL / LANGGRAPH ROUTER
  # -----------------------------------------------------------------
  retrieval-router:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./app/configs/.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-credentials.json
    volumes:
      - ./:/workspace
      - type: bind
        source: ./app/configs/e2e-langragh-chatbot-510511-cb0dd6b38e63.json
        target: /run/secrets/google-credentials.json
        read_only: true
        bind:
          create_host_path: false
    command:
      - python
      - -u
      - -c
      - "import asyncio; from app.router_service.request_response_router import RequestResponseRouter; asyncio.run(RequestResponseRouter().start())"
    restart: unless-stopped

  # -----------------------------------------------------------------
  # 2. VECTOR DATABASE ENGINE
  # -----------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
    container_name: es
    env_file:
      - ./app/configs/.env
    environment:
      - node.name=es01
      - cluster.name=${ES_CLUSTER_NAME:-docsprawl-es}
      - discovery.type=single-node
      
      # 🎯 MANDATORY SETTINGS FOR 9.x SERIES ECOSYSTEMS
      - xpack.security.enabled=false
      - ELASTIC_PASSWORD=${ES_PASSWORD:-strongpassword123} 
      
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-4g} -Xmx${ES_HEAP:-4g}
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      # Updated healthcheck to authenticate using the custom system user credentials
      test: ["CMD-SHELL", "curl -u elastic:${ES_PASSWORD:-strongpassword123} -sSf http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10


  # -----------------------------------------------------------------
  # 3. STREAMING & EVENT BACKBONE
  # -----------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.10
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.9.10
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Define two distinct listener interfaces: INTERNAL for container routing, EXTERNAL for host machine routing
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9094:9094" # Expose the external listener port to your laptop

  kafka-setup:
    image: confluentinc/cp-kafka:7.9.10
    container_name: kafka_setup
    user: root
    depends_on:
      - kafka
    entrypoint: [ "sh", "-c", "
      echo 'Waiting for Kafka to be ready...';
      cub kafka-ready -b kafka:9092 1 30;
      
      echo 'Creating production-grade topics...';
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic dsprawl.chunks;
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic dsprawl.embedded_chunks;
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic chat-requests;
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --topic chat-responses;
      
      echo 'All topics successfully provisioned!';
      " ]

  
  # -----------------------------------------------------------------
  # 4. RAW FILE/OBJECT STORAGE TIER
  # -----------------------------------------------------------------
  # 1. Production-Grade Secure MinIO Service
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    depends_on:
      minio-volume-provisioner:
        condition: service_completed_successfully  # <--- FIXED TYPO HERE
    env_file:
      - ./app/configs/.env
    command: server /data --console-address ":9001" --address ":9000"
    volumes:
      - miniodata:/data
    ports:
      - "9010:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


  # 2. Production Pattern: Init Container to securely fix volume ownership
  minio-volume-provisioner:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio_provisioner
    volumes:
      - miniodata:/data
    user: "0:0"
    entrypoint:
      [
        "sh",
        "-c",
        "chown -R 100:101 /data && chmod -R 775 /data"
    ]



  minio-console:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio_mc

    depends_on:
      minio:
        condition: service_started

    env_file:
      - ./app/configs/.env

    entrypoint:
      [
        "sh",
        "-c",
        "until nc -z minio 9000; do sleep 1; done; mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; mc mb --ignore-existing local/$${MINIO_BUCKET} || true; tail -f /dev/null"
      ]

  # -----------------------------------------------------------------
  # 5. STATE STATEFUL CHECKPOINT MEMORY
  # -----------------------------------------------------------------
  redis:
    # 🎯 FIX: Changed from vanilla alpine to redis-stack-server to include RedisJSON & RediSearch modules
    image: redis/redis-stack-server
    container_name: redis
    # 🎯 FIX: Enabled appendonly for durable STM checkpoints and attached a named volume
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:2.64.0
    container_name: redisinsight
    ports:
      - "8001:8001"
    depends_on:
      - redis

volumes:
  esdata:
  miniodata:
  redisdata: # 🎯 FIX: Added persistent target volume boundary for local stm assets
